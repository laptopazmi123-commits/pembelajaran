<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - ZimzzCode</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-container">
    <a href="index.html" class="back-home">← Kembali</a>
    <div class="auth-box">
      <div class="logo auth-logo">💻 Zimzz<span>Code</span></div>
      
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Masuk</button>
        <button class="tab" onclick="switchTab('register')">Daftar</button>
      </div>

      <!-- Form Login -->
      <form id="loginForm" class="auth-form">
        <h2>Selamat Datang Kembali</h2>
        <input type="email" id="loginEmail" placeholder="Email (Gmail)" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="btn-primary btn-block">Masuk</button>
        <p class="divider"><span>atau masuk dengan</span></p>
        <div class="oauth-buttons">
          <button type="button" class="oauth-btn google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Gmail
          </button>
          <button type="button" class="oauth-btn github" onclick="loginWithGitHub()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </button>
        </div>
      </form>

      <!-- Form Register -->
      <form id="registerForm" class="auth-form hidden">
        <h2>Buat Akun Baru</h2>
        <input type="text" id="regName" placeholder="Nama Lengkap" required>
        <input type="email" id="regEmail" placeholder="Email (Gmail)" required>
        <input type="password" id="regPassword" placeholder="Password (min 6 karakter)" minlength="6" required>
        <button type="submit" class="btn-primary btn-block">Daftar Gratis</button>
        <p class="divider"><span>atau daftar dengan</span></p>
        <div class="oauth-buttons">
          <button type="button" class="oauth-btn google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Gmail
          </button>
          <button type="button" class="oauth-btn github" onclick="loginWithGitHub()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </button>
        </div>
      </form>

      <p id="authMessage" class="auth-message"></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
