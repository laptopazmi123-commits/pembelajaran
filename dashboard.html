<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ZimzzCode</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="logo">💻 Zimzz<span>Code</span></div>
    <div class="nav-links">
      <span id="userName" class="user-name"></span>
      <button type="button" onclick="logout()" class="btn-login">Keluar</button>
    </div>
  </nav>

  <section class="dashboard">
    <h1>Halo, <span id="welcomeName">Siswa</span>! 👋</h1>
    <p>Lanjutkan perjalanan belajar coding-mu hari ini.</p>

    <div class="progress-section">
      <h2>Progress Belajar</h2>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 35%">35%</div>
      </div>
    </div>

    <div class="courses">
      <h2>Kursus Saya</h2>
      <div class="course-grid">
        <div class="card">
          <div class="icon">🌐</div>
          <h3>HTML & CSS</h3>
          <p>Progress: 80%</p>
          <a href="#" class="btn-primary">Lanjutkan</a>
        </div>
        <div class="card">
          <div class="icon">⚡</div>
          <h3>JavaScript</h3>
          <p>Progress: 40%</p>
          <a href="#" class="btn-primary">Lanjutkan</a>
        </div>
        <div class="card">
          <div class="icon">🐍</div>
          <h3>Python</h3>
          <p>Progress: 10%</p>
          <a href="#" class="btn-primary">Lanjutkan</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
