<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kursus HTML - ZimzzCode</title>
  <!-- Memanggil file CSS utama -->
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigasi Atas -->
  <nav class="navbar">
    <div class="logo">💻 Zimzz<span>Code</span></div>
    <div class="nav-links">
      <a href="dashboard.html" class="btn-login">← Dashboard</a>
      <div class="mode-buttons">
        <button type="button" class="mode-btn" id="themeBtn" onclick="toggleTheme()" title="Mode Gelap/Terang">🌙</button>
        <button type="button" class="mode-btn" id="focusBtn" onclick="toggleFocus()" title="Mode Fokus">⛶</button>
      </div>
      <span id="userName" class="user-name"></span>
    </div>
  </nav>

  <!-- Layout Kursus -->
  <div class="lesson-layout">
    <!-- Sidebar Kiri -->
    <aside class="lesson-sidebar">
      <div class="sidebar-header">
        <h3>📚 Materi HTML</h3>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
          <option value="id">🇮🇩 Indonesia</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>
      
      <!-- Daftar Materi akan muncul di sini -->
      <ul id="lessonList"></ul>
      
      <!-- Progress Bar -->
      <div class="progress-box">
        <p>Progress: <strong id="progressText">0/8</strong></p>
        <div class="progress-bar-small">
          <div id="progressFill" class="progress-fill-small" style="width:0%"></div>
        </div>
      </div>
    </aside>

    <!-- Konten Utama Kanan -->
    <main class="lesson-content">
      <div id="lessonContent">
        <p>Memuat materi...</p>
      </div>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- SCRIPT DIPANGGIL DI PALING BAWAH -->
  <!-- ========================================== -->
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/kursus-html.js"></script>
</body>
</html>
